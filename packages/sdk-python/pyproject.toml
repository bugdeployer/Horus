[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "horus-sdk"
version = "0.4.0b1"
description = "Explicit runtime capture for Python applications"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{name = "bugdeployer"}]
[project.urls]
Repository = "https://github.com/bugdeployer/Horus"
[tool.setuptools.packages.find]
include = ["horus_sdk*"]
