services:
  horus:
    build: .
    ports: ["127.0.0.1:3100:3100"]
    environment:
      DATABASE_PATH: /data/history.db
    volumes: ["history:/data"]
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3100/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  history:
