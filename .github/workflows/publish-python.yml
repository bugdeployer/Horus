name: publish Python SDK

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated SDK to PyPI
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-python
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'bugdeployer/Horus' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install build twine pytest
      - run: python -m build packages/sdk-python --outdir dist
      - run: python -m twine check --strict dist/*
      - run: python -m pip install dist/*.whl
      - name: Test installed SDK delivery
        run: python -m pytest -c /dev/null tests/test_delivery.py -q
      - uses: actions/upload-artifact@v4
        with:
          name: python-sdk
          path: dist/*
          if-no-files-found: error

  publish:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/horus-sdk/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-sdk
          path: dist
      - name: Publish SDK
        uses: pypa/gh-action-pypi-publish@release/v1
